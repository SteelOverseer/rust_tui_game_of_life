name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: rust_tui_game_of_life
            asset_name: game-of-life-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: rust_tui_game_of_life.exe
            asset_name: game-of-life-windows-x86_64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: rust_tui_game_of_life
            asset_name: game-of-life-macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: rust_tui_game_of_life
            asset_name: game-of-life-macos-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} dist/${{ matrix.asset_name }}

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset_name }}
